<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Elf's Xmas Adventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>/*LEAFLETCSS*/</style>
<style>
/* Layout: storybook winter village. Story panel on the left (bottom sheet on phones), snowy map drawn from Census roads and water. Single light theme by choice: red, white and green. */
:root{
  --snow:#fffdf8; --paper:#fbf6ec; --land:#f3efe6; --red:#d62839; --red-dk:#9e1b2a; --green:#1f8a4c; --green-dk:#0f5a32;
  --ink:#3a2326; --muted:#7b6a63; --gold:#e9b44c; --ice:#dcefe7;
  --display:"Mountains of Christmas", "Brush Script MT", cursive;
  --body:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--body);display:grid;grid-template-columns:400px 1fr;overflow:hidden}
aside{position:relative;background:var(--snow);display:flex;flex-direction:column;min-height:0;z-index:2;border-right:6px solid var(--red);
  box-shadow:inset -6px 0 0 #fff, 4px 0 0 var(--green)}
aside::before{content:"";position:absolute;right:-12px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,var(--red) 0 14px,#fff 14px 28px);z-index:3}
header{padding:16px 18px 12px;display:flex;flex-direction:column;gap:12px;background:
  radial-gradient(circle at 12% 20%,#fff 0 2px,transparent 3px) 0 0/34px 30px,
  radial-gradient(circle at 70% 60%,#ffffffcc 0 1.6px,transparent 2.4px) 0 0/26px 24px,
  linear-gradient(180deg,var(--green-dk),var(--green));color:#fff;border-bottom:5px solid var(--red)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:62px;height:62px;flex:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
h1{font:700 34px/1.08 var(--display);margin:0;color:#fff;text-shadow:0 3px 0 var(--red-dk),0 0 12px rgba(255,255,255,.25);letter-spacing:.01em;text-wrap:balance}
.sub{margin:6px 0 0;font-weight:600;font-size:13px;color:#e7f6ec}
.count{display:flex;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 var(--red-dk)}
.count .num{font:700 44px/1 var(--display);color:var(--red);min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.count .lbl{font-weight:800;font-size:16px;line-height:1.1}
.count .lbl small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.stickers{background:#fff;color:var(--ink);border-radius:18px;padding:8px 12px 10px;box-shadow:0 4px 0 var(--red-dk)}
.stickers .top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.stickers .top b{color:var(--green);font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}
.slot{aspect-ratio:1;border-radius:50%;border:2px dashed #d9cfc2;display:grid;place-items:center;background:#faf7f2}
.slot svg{width:80%;height:80%;opacity:.18;filter:grayscale(1)}
.slot.got{border:2px solid var(--gold);background:#fff6dd;animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.slot.got svg{opacity:1;filter:none}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.orns{display:flex;gap:10px;justify-content:space-between;padding:12px 14px 4px;background:var(--snow);flex-wrap:wrap}
.orn{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 12px/1.1 var(--body);color:var(--ink);width:64px;text-align:center}
.orn .ball{position:relative;width:52px;height:52px;border-radius:50%;margin-top:12px;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0 7%,rgba(255,255,255,0) 22%),radial-gradient(circle at 50% 55%,var(--c,var(--red)) 0 55%,var(--cd,var(--red-dk)) 100%);
  box-shadow:0 4px 0 rgba(58,35,38,.18), inset 0 -5px 8px rgba(0,0,0,.18);transition:transform .15s}
.orn .ball::before{content:"";position:absolute;top:-9px;left:50%;width:16px;height:9px;transform:translateX(-50%);border-radius:3px 3px 1px 1px;background:linear-gradient(90deg,#c9932f,#f6d57a,#c9932f)}
.orn .ball::after{content:"";position:absolute;top:-17px;left:50%;width:9px;height:9px;transform:translateX(-50%);border:2px solid #b88a2e;border-radius:50%}
.orn .ball svg{width:26px;height:26px}
.orn:hover .ball{transform:rotate(-8deg) translateY(-2px)}
.orn[aria-pressed="false"] .ball{--c:#d8d2ca;--cd:#a9a097}
.orn.g .ball{--c:var(--green);--cd:var(--green-dk)}
.orn.w .ball{--c:#ffffff;--cd:#d9d2c8}
.orn:focus-visible .ball{outline:3px solid var(--gold);outline-offset:3px}
ol{list-style:none;margin:0;padding:6px 14px 14px;overflow-y:auto;flex:1;min-height:0}
.city{font:700 22px/1 var(--display);color:var(--green);margin:14px 4px 6px;display:flex;align-items:center;gap:8px}
.city::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,transparent 8px 14px)}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:50px 1fr;gap:2px 12px;width:100%;background:#fff;border:2px solid #efe4d6;border-radius:16px;padding:10px 12px;margin-bottom:8px;box-shadow:0 3px 0 #e8dccb}
.card:hover,.card.on{border-color:var(--red);box-shadow:0 3px 0 var(--red-dk)}
.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card .ic{grid-row:1/4;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff 0 10%,transparent 30%),var(--bg)}
.card .ic svg{width:34px;height:34px}
.card .nm{font-weight:800;font-size:16px;line-height:1.15}
.card .wh{font-size:13px;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.chip{font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 8px;background:#f3eee6;color:var(--ink)}
.chip.now{background:var(--green);color:#fff}
.chip.soon{background:#fde7ea;color:var(--red-dk)}
.chip.done{background:#eee;color:#888}
.chip.free{background:#e2f4e8;color:var(--green-dk)}
.chip.star{background:#fff3cf;color:#8a5a00}
footer{padding:8px 16px;font-size:11.5px;font-weight:600;color:var(--muted);border-top:2px dashed #eadfce;background:var(--snow)}
#board{position:relative;min-height:0}
#map{position:absolute;inset:0;background-color:var(--land);
  background-image:radial-gradient(#ffffff 1.6px,transparent 2.2px),radial-gradient(#e9e3d7 1.2px,transparent 1.8px);
  background-size:26px 26px,19px 19px;background-position:0 0,9px 12px}
.leaflet-container{font:inherit;background:transparent}
#snow{position:absolute;inset:0;pointer-events:none;z-index:500}
.town{display:inline-block;transform:translate(-50%,-50%);font:700 19px/1 var(--display);color:var(--green-dk);background:#fff;border:2.5px solid var(--green);border-radius:10px;padding:3px 9px 2px;box-shadow:0 3px 0 var(--green-dk);white-space:nowrap;position:relative}
.town::before,.town::after{content:"";position:absolute;top:-7px;width:3px;height:7px;background:var(--red)}
.town::before{left:10px}.town::after{right:10px}
.shield{display:inline-block;transform:translate(-50%,-50%);font:800 11px/1 var(--body);padding:3px 6px;border-radius:6px 6px 10px 10px;background:var(--red);color:#fff;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--red-dk)}
.shield.s{background:#fff;color:var(--green-dk);box-shadow:0 0 0 1.5px var(--green-dk);border-radius:50%}
.deco{transform:translate(-50%,-100%);pointer-events:none}
.pin{position:relative;width:66px;height:82px;cursor:pointer}
.pin .body{position:absolute;inset:0;transform-origin:50% 92%}
.pin.wig .body{animation:wiggle .7s ease}
.pin.sel .body{animation:bob 1.1s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.12)}45%{transform:rotate(11deg) scale(1.15)}70%{transform:rotate(-6deg) scale(1.08)}}
@keyframes bob{50%{transform:translateY(-9px) scale(1.08)}}
.pin .star{position:absolute;right:-4px;top:-8px;width:30px;height:30px;display:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.pin.got .star{display:block}
.pin.past{opacity:.6}
.leaflet-div-icon{background:none;border:0}
.leaflet-popup-content-wrapper{background:var(--snow);color:var(--ink);border-radius:22px;border:3px solid var(--red);box-shadow:0 6px 0 var(--green),0 12px 30px rgba(0,0,0,.18)}
.leaflet-popup-tip{background:var(--red)}
.leaflet-popup-content{margin:14px 16px;min-width:250px}
.leaflet-container a.leaflet-popup-close-button{color:var(--red);font-size:24px;top:8px;right:10px}
.pop h3{font:700 26px/1 var(--display);margin:0 28px 6px 0;color:var(--red-dk)}
.pop .chips{margin-bottom:8px}
.pop dl{margin:0 0 8px;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:13.5px}
.pop dt{font-weight:800;color:var(--green)}
.pop dd{margin:0;font-weight:600}
.pop p{margin:0 0 6px;font-size:13.5px}
.pop ul{margin:0 0 10px;padding-left:18px;font-size:13px}
.pop ul li::marker{content:"❄ ";color:var(--green)}
.pop .acts{display:flex;justify-content:space-around;gap:6px}
.pop .orn{width:72px;font-size:11.5px;color:var(--ink);text-decoration:none}
.pop .orn .ball{width:44px;height:44px}
.pop .orn .ball svg{width:22px;height:22px}
.leaflet-bar{border:0!important;box-shadow:0 3px 0 var(--green-dk)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{background:#fff;color:var(--red);font:800 22px/30px var(--body);border-color:#eee}
.leaflet-control-attribution{background:rgba(255,253,248,.85)!important;color:var(--muted);font-weight:600}
.np{position:absolute;left:12px;bottom:26px;z-index:600;background:#fff;border:2px solid var(--green);border-radius:14px;padding:6px 14px;font:800 13px var(--body);color:var(--green-dk);box-shadow:0 3px 0 var(--green-dk);display:none;cursor:pointer}
.np[aria-pressed="true"]{background:var(--green);color:#fff;border-color:#fff}
.np:hover{transform:translateY(-1px)}
.np:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-dk)}
.np:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.np.show{display:block}
#sleigh{all:unset;position:absolute;top:14px;right:14px;z-index:650;cursor:pointer;filter:drop-shadow(0 8px 6px rgba(58,35,38,.25));animation:hover 2.6s ease-in-out infinite;will-change:transform}
#sleigh svg{display:block;width:230px;height:auto}
#sleigh:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:12px}
#sleigh.flying{animation:none}
#sleigh .leg{transform-origin:50% 0;transform-box:fill-box;animation:gallop .5s ease-in-out infinite alternate}
#sleigh .d2 .leg{animation-delay:-.25s}
@keyframes gallop{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes hover{50%{transform:translateY(-7px) rotate(-1.5deg)}}
.spark{position:absolute;z-index:640;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;background:radial-gradient(circle,#fff 0 25%,#ffe08a 40%,transparent 70%);border-radius:50%;animation:spark 1.2s ease-out forwards}
.spark.s{background:none;width:14px;height:14px}
.spark.s::before{content:"✦";position:absolute;inset:0;font-size:14px;line-height:14px;color:#e9b44c;text-shadow:0 0 4px #fff}
@keyframes spark{to{opacity:0;transform:translateY(16px) scale(.3)}}
.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-260%);background:var(--red);color:#fff;border:3px solid #fff;outline:3px solid var(--green);border-radius:18px;padding:8px 18px;font:700 22px/1.1 var(--display);z-index:1000;transition:transform .4s cubic-bezier(.3,1.6,.5,1);pointer-events:none;text-align:center}
.toast.show{transform:translate(-50%,0)}
#toggle{display:none}
@media (max-width:760px){
  body{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #board{grid-row:1}
  aside{grid-row:2;max-height:50vh;border-right:0;box-shadow:none;border-top:6px solid var(--red)}
  aside::before{display:none}
  aside.min ol,aside.min footer,aside.min .stickers,aside.min .orns,aside.min .sub{display:none}
  header{padding:12px 14px 10px;gap:9px}
  h1{font-size:28px}
  .logo{width:48px;height:48px}
  .count .num{font-size:36px}
  #toggle{display:inline-flex}
  #sleigh svg{width:150px}
  #sleigh{top:10px;right:8px}
  .orn{width:58px;font-size:11px}
  .orns .orn .ball{width:42px;height:42px}
  footer{font-size:10.5px;padding:6px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const PINC={tree:["#1f8a4c","#0f5a32"],star:["#e9b44c","#b4821f"],nutcracker:["#d62839","#9e1b2a"],santa:["#d62839","#9e1b2a"],train:["#1f8a4c","#0f5a32"],bell:["#e9b44c","#b4821f"],drum:["#d62839","#9e1b2a"],snowman:["#5aa9c9","#2f7392"],train2:["#1f8a4c","#0f5a32"],gift:["#d62839","#9e1b2a"]};
const TOWNS=[["Palo Alto",37.4419,-122.143],["Mountain View",37.405,-122.065],["Sunnyvale",37.378,-122.03],["Santa Clara",37.362,-121.955],["Milpitas",37.445,-121.885],["San Jose",37.36,-121.86],["Cupertino",37.318,-122.045],["Campbell",37.298,-121.962],["Saratoga",37.265,-122.03],["Los Gatos",37.215,-121.99],["Morgan Hill",37.13,-121.655],["Gilroy",37.02,-121.575]];

/* ---- dates (Pacific time) ---- */
const todayStr=new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const D=s=>{const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d);};
const T=D(todayStr), DAY=864e5;
let xmas=D(todayStr.slice(0,4)+"-12-25"); if(T>xmas) xmas=D((+todayStr.slice(0,4)+1)+"-12-25");
const sleeps=Math.round((xmas-T)/DAY);
document.getElementById("sleeps").textContent=sleeps;
document.getElementById("sleepsTxt").textContent=sleeps===0?"It's Christmas! 🎄":sleeps===1?"sleep until Christmas!":"sleeps until Christmas!";
document.getElementById("today").textContent="Today is "+new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",weekday:"long",month:"long",day:"numeric"}).format(new Date());
function status(e){
  const s=D(e.start), en=D(e.end);
  if(T>en) return {k:"done",t:"All done this year"};
  if(T>=s) return {k:"now",t:"Happening now!"};
  const n=Math.round((s-T)/DAY);
  return {k:"soon",t:n===1?"Tomorrow!":`In ${n} days`};
}

const TREE=`<svg width="22" height="28" viewBox="0 0 22 28"><path d="M11 1l7 9h-4l6 8H2l6-8H4z" fill="#2f9a5a" stroke="#0f5a32" stroke-width="1.4" stroke-linejoin="round"/><path d="M11 1l3 4-3 1-3-1z" fill="#fff"/><path d="M5 17l3-2 3 2 3-2 3 2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><rect x="9" y="18" width="4" height="5" fill="#8a5a2b"/></svg>`;
const HOUSE=`<svg width="26" height="24" viewBox="0 0 26 24"><path d="M3 12h20v11H3z" fill="#fff6e6" stroke="#9e1b2a" stroke-width="1.4"/><path d="M1 13L13 3l12 10" fill="#d62839" stroke="#9e1b2a" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 11L13 4l9 7" fill="none" stroke="#fff" stroke-width="2"/><rect x="11" y="16" width="4" height="7" fill="#1f8a4c"/><rect x="5.5" y="15" width="3.5" height="3.5" fill="#ffd56a" stroke="#9e1b2a" stroke-width=".8"/><rect x="17" y="15" width="3.5" height="3.5" fill="#ffd56a" stroke="#9e1b2a" stroke-width=".8"/></svg>`;
DECO.forEach(([a,b,k])=>L.marker([a,b],{pane:"deco",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<div class="deco">${k==="h"?HOUSE:TREE}</div>`,iconSize:[0,0]})}).addTo(map));
TOWNS.forEach(([t,a,b])=>L.marker([a,b],{pane:"labels",interactive:false,keyboard:false,icon:L.divIcon({className:"",html:`<span class="town">${t}</span>`,iconSize:[0,0]})}).addTo(map));

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STAR=`<svg class="star" viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7-6.2-3.6-6.2 3.6 1.4-7L2 9.3l7-.8z" fill="#e9b44c" stroke="#3a2326" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const state={sel:null,free:false,hidePast:false};
function pinHTML(e){
  const [c,cd]=PINC[e.icon], st=status(e);
  const P="M33 72C33 72 7 47 7 30a26 26 0 0 1 52 0c0 17-26 42-26 42z";
  return `<div class="pin ${got.has(e.id)?"got":""} ${state.sel===e.id?"sel":""} ${st.k==="done"?"past":""}" data-id="${e.id}">
   <svg viewBox="0 0 66 82" width="66" height="82" style="position:absolute;inset:0"><ellipse cx="34" cy="77" rx="14" ry="4.5" fill="rgba(58,35,38,.3)"/></svg>

   </svg>${STAR}</div></div>`;
}
// fan out pins that sit close together (pixel offsets, so they stay readable at every zoom)
(function(){const done=new Set();EVENTS.forEach(e=>{e.dx=0;e.dy=0;});
  EVENTS.forEach(e=>{if(done.has(e.id))return;const g=EVENTS.filter(o=>!done.has(o.id)&&Math.abs(o.lat-e.lat)<.03&&Math.abs(o.lng-e.lng)<.035);
    g.forEach(o=>done.add(o.id));if(g.length<2)return;
    const F=g.length===2?[[-30,0],[30,0]]:[[-40,10],[0,-18],[40,10],[0,38]];

  return `<div class="pop"><h3>${esc(e.n)}</h3>
   <div class="chips"><span class="chip ${st.k}">${st.t}</span><span class="chip">${esc(e.type)}</span>${e.free?'<span class="chip free">Free</span>':''}${g?'<span class="chip star">★ Sticker earned</span>':''}</div>
   <dl><dt>When</dt><dd>${esc(e.when)}</dd><dt>Cost</dt><dd>${esc(e.price)}</dd><dt>Where</dt><dd>${esc(e.a)}</dd></dl>
   <p>${esc(e.about)}</p>
   <ul>${e.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
   <div class="acts">
    <button class="orn ${g?"g":""} mark" data-id="${e.id}"><span class="ball"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.3 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="#fff"/></svg></span><span>${g?"We went! ✓":"We went!"}</span></button>
    <a class="orn g" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(e.n+", "+e.a)}" target="_blank" rel="noopener"><span class="ball"><svg viewBox="0 0 24 24"><path d="M12 2l7 19-7-4-7 4z" fill="#fff"/></svg></span><span>Directions</span></a>
    <a class="orn w" href="${e.url}" target="_blank" rel="noopener"><span class="ball"><svg viewBox="0 0 24 24" fill="none" stroke="#d62839" stroke-width="2.4" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span><span>Event page</span></a>
   </div></div>`;

EVENTS.forEach(e=>{

  e.m.on("popupclose",()=>{if(state.sel===e.id){state.sel=null;refreshPin(e);document.querySelectorAll(".card.on").forEach(c=>c.classList.remove("on"));}});
});
map.on("popupopen",ev=>{
  const b=ev.popup.getElement().querySelector(".mark");
  if(b)b.onclick=x=>{x.stopPropagation();const id=b.dataset.id;toggleSticker(id);setTimeout(()=>{ev.popup.setContent(popHTML(EVENTS.find(e=>e.id===id)));map.fire("popupopen",{popup:ev.popup});},0);};
});
function refreshPin(e){
  e.m.options.icon=mkIcon(e);
  const el=e.m.getElement&&e.m.getElement(), p=el&&el.querySelector(".pin");
  if(p){p.classList.toggle("got",got.has(e.id));p.classList.toggle("sel",state.sel===e.id);}
}
function wiggle(e){
  const p=e.m.getElement()&&e.m.getElement().querySelector(".pin"); if(!p)return;
  p.classList.remove("wig");void p.offsetWidth;p.classList.add("wig");setTimeout(()=>p.classList.remove("wig"),750);

  flySanta();
}

/* ---- list ---- */
const CITY_ORDER=["Mountain View","Santa Clara","San Jose","Campbell","Los Gatos","Gilroy"];
const list=document.getElementById("list");
function visible(e){return (!state.free||e.free)&&(!state.hidePast||status(e).k!=="done");}
function render(){
  const vis=EVENTS.filter(visible);
  EVENTS.forEach(e=>{const on=vis.includes(e);if(on&&!map.hasLayer(e.m))e.m.addTo(map);if(!on&&map.hasLayer(e.m))e.m.remove();});
  let html="";
  CITY_ORDER.forEach(c=>{
    const es=vis.filter(e=>e.city===c).sort((a,b)=>a.start.localeCompare(b.start));
    if(!es.length)return;
    html+=`<li class="city">${c}</li>`;
    es.forEach(e=>{const st=status(e),[col]=PINC[e.icon];
      html+=`<li><button class="card ${state.sel===e.id?"on":""}" id="card-${e.id}" data-id="${e.id}"><span class="ic" style="--bg:${col}33">${svg(e.icon)}</span><span class="nm">${esc(e.n)}</span><span class="wh">${esc(e.when)}</span><span class="chips"><span class="chip ${st.k}">${st.t}</span>${e.free?'<span class="chip free">Free</span>':''}${got.has(e.id)?'<span class="chip star">★ Sticker</span>':''}</span></button></li>`;});
  });
  list.innerHTML=html||`<li style="padding:18px;font-weight:700;color:var(--muted);text-align:center">No events match. Turn a filter off to see more.</li>`;
  list.querySelectorAll(".card").forEach(b=>b.onclick=()=>{const e=EVENTS.find(x=>x.id===b.dataset.id);select(e.id,true);});
  renderSlots();
}
function select(id,fly){
  if(!userStopped)startMusic();
  const prev=state.sel;state.sel=id;
  if(prev&&prev!==id)refreshPin(EVENTS.find(e=>e.id===prev));
  const e=EVENTS.find(x=>x.id===id);refreshPin(e);
  document.querySelectorAll(".card.on").forEach(c=>c.classList.remove("on"));
  const card=document.getElementById("card-"+id);
  if(card){card.classList.add("on");if(!fly)card.scrollIntoView({block:"nearest"});}
  if(fly){map.flyTo([e.lat,e.lng],Math.max(map.getZoom(),13),{duration:.8});map.once("moveend",()=>{e.m.openPopup();wiggle(e);});}
}
let tt;function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2400);}
function toggleSticker(id){
  const e=EVENTS.find(x=>x.id===id);
  if(got.has(id)){got.delete(id);}
  else{got.add(id);Music.chime();
    toast(got.size===EVENTS.length?"All 10 stickers! Super Elf! 🎄":`New sticker! ${got.size} / ${EVENTS.length}`);}
  saveSt();refreshPin(e);render();
}

/* ---- buttons ---- */
const tgl=(b,on)=>b.setAttribute("aria-pressed",String(on));
const bFree=document.getElementById("bFree"),bSoon=document.getElementById("bSoon"),bSnow=document.getElementById("bSnow");
bFree.onclick=()=>{state.free=!state.free;tgl(bFree,state.free);render();};
bSoon.onclick=()=>{state.hidePast=!state.hidePast;tgl(bSoon,state.hidePast);render();};
const bReset=document.getElementById("bReset"),bResetL=document.getElementById("bResetL");let armed=false;
bReset.onclick=()=>{
  if(!armed){armed=true;bResetL.textContent="Tap again";setTimeout(()=>{armed=false;bResetL.textContent="New sticker book";},3000);return;}
  armed=false;bResetL.textContent="New sticker book";got.clear();saveSt();EVENTS.forEach(refreshPin);render();toast("Fresh sticker book!");
};
const panel=document.getElementById("panel"),tog=document.getElementById("toggle");
tog.onclick=()=>{const min=panel.classList.toggle("min");tog.querySelector("span").textContent=min?"Show":"Hide";tog.setAttribute("aria-expanded",String(!min));setTimeout(()=>map.invalidateSize(),60);};

/* ---- snow ---- */
const cv=document.getElementById("snow"),cx=cv.getContext("2d");let flakes=[],snowOn=!matchMedia("(prefers-reduced-motion: reduce)").matches,raf=0;
function sizeCv(){const r=cv.getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
function initFlakes(){const r=cv.getBoundingClientRect();flakes=Array.from({length:Math.round(r.width*r.height/9000)},()=>({x:Math.random()*r.width,y:Math.random()*r.height,r:1.2+Math.random()*3,s:.3+Math.random()*.9,w:Math.random()*6.28}));}
function tick(){const r=cv.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);cx.fillStyle="#fff";cx.strokeStyle="rgba(160,190,200,.7)";cx.lineWidth=.8;
  for(const f of flakes){f.y+=f.s;f.w+=.02;f.x+=Math.sin(f.w)*.4;if(f.y>r.height+5){f.y=-5;f.x=Math.random()*r.width;}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill();cx.stroke();}
  raf=requestAnimationFrame(tick);}
function setSnow(on){snowOn=on;tgl(bSnow,on);cancelAnimationFrame(raf);const r=cv.getBoundingClientRect();cx.clearRect(0,0,r.width,r.height);if(on){sizeCv();initFlakes();tick();}}
bSnow.onclick=()=>setSnow(!snowOn);
addEventListener("resize",()=>{if(snowOn){sizeCv();initFlakes();}});

/* ---- music: public-domain carols as chiptune ---- */
const Music=(()=>{
  let ctx=null,master=null,timer=null,on=false,noiseBuf=null,si=0,step=0,nextT=0,ni=0,noteStep=0;
  const N=n=>{const m=n.match(/^([A-G])(#|b)?(\d)$/);const s={C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2}[m[1]]+(m[2]==="#"?1:m[2]==="b"?-1:0);return 440*Math.pow(2,(s+(+m[3]-4)*12)/12);};
  const P=s=>s.trim().split(/\s+/).map(t=>{const[n,l]=t.split(":");return[n,+l];});
  const SONGS=[
   {name:"Jingle Bells",bpm:150,bar:8,
    notes:P("E5:2 E5:2 E5:4 E5:2 E5:2 E5:4 E5:2 G5:2 C5:3 D5:1 E5:8 F5:2 F5:2 F5:3 F5:1 F5:2 E5:2 E5:2 E5:1 E5:1 E5:2 D5:2 D5:2 E5:2 D5:4 G5:4 E5:2 E5:2 E5:4 E5:2 E5:2 E5:4 E5:2 G5:2 C5:3 D5:1 E5:8 F5:2 F5:2 F5:3 F5:1 F5:2 E5:2 E5:2 E5:1 E5:1 G5:2 G5:2 F5:2 D5:2 C5:8"),
    chords:"C C C C F C G G C C C C F C G C".split(" ").map(c=>[c,8])},
   {name:"Deck the Halls",bpm:132,bar:8,
    notes:P("G5:3 F5:1 E5:2 D5:2 C5:2 D5:2 E5:2 C5:2 D5:1 E5:1 F5:1 D5:1 E5:3 D5:1 C5:2 B4:2 C5:4 G5:3 F5:1 E5:2 D5:2 C5:2 D5:2 E5:2 C5:2 D5:1 E5:1 F5:1 D5:1 E5:3 D5:1 C5:2 B4:2 C5:4"),
    chords:"C C G C C C G C".split(" ").map(c=>[c,8])},
   {name:"We Wish You a Merry Christmas",bpm:156,bar:6,
    notes:P("G4:2 C5:2 C5:1 D5:1 C5:1 B4:1 A4:2 A4:2 A4:2 D5:2 D5:1 E5:1 D5:1 C5:1 B4:2 G4:2 G4:2 E5:2 E5:1 F5:1 E5:1 D5:1 C5:2 A4:2 G4:1 G4:1 A4:2 D5:2 B4:2 C5:6"),
    chords:[["G",2],["C",6],["F",6],["D",6],["G",6],["E",6],["A",6],["G",6],["C",6]]}
  ];
  const ROOT={C:"C3",D:"D3",E:"E3",F:"F2",G:"G2",A:"A2"};
  const ARP={C:["C5","E5","G5"],D:["D5","F#5","A5"],E:["E5","G#5","B5"],F:["F5","A5","C6"],G:["G4","B4","D5"],A:["A4","C5","E5"]};
  function tone(type,f,t,d,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.03);}
  function noise(t,d,v,hp){const s=ctx.createBufferSource();s.buffer=noiseBuf;const f=ctx.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+d+.03);}
  function bells(t,v){for(let i=0;i<3;i++)noise(t+i*.012,.06,v,6500+i*900);}
  function chordAt(song,st){let acc=0;for(const[c,l]of song.chords){if(st<acc+l)return[c,st-acc];acc+=l;}return[song.chords[0][0],0];}
  function songLen(song){return song.notes.reduce((a,n)=>a+n[1],0);}
  function schedule(){
    while(nextT<ctx.currentTime+.15){
      const song=SONGS[si],E=60/song.bpm/2,len=songLen(song);
      if(step>=len+4){si=(si+1)%SONGS.length;step=0;ni=0;noteStep=0;np(SONGS[si].name);continue;}
      if(step<len){
        if(ni<song.notes.length&&step===noteStep){const[n,l]=song.notes[ni];tone("square",N(n),nextT,E*l*.9,.1);tone("triangle",N(n)*2,nextT,E*Math.min(l,2)*.6,.03);noteStep+=l;ni++;}
        const[c,inBar]=chordAt(song,step);const rf=N(ROOT[c]);
        tone("triangle",inBar%2?rf*2:rf,nextT,E*.85,.26);
        if(inBar%2===1)tone("square",N(ARP[c][(inBar>>1)%3]),nextT,E*.4,.02);
        if(inBar===0)tone("sine",110,nextT,.14,.3);
        bells(nextT,inBar%2?.03:.06);
      }
      step++;nextT+=E;
    }
  }
  function init(){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.5;const comp=ctx.createDynamicsCompressor();master.connect(comp).connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  async function ensure(){if(!ctx)init();if(ctx.state!=="running")await ctx.resume();}
  return{
    async start(){await ensure();on=true;step=0;ni=0;noteStep=0;nextT=ctx.currentTime+.06;clearInterval(timer);timer=setInterval(schedule,25);np(SONGS[si].name);},
    stop(){on=false;clearInterval(timer);timer=null;},
    get on(){return on;},
    async jingle(){try{await ensure();const t=ctx.currentTime+.02;for(let i=0;i<6;i++){bells(t+i*.07,.12);}tone("triangle",N("E6"),t,.25,.08);tone("triangle",N("G6"),t+.12,.3,.07);}catch(e){}},
    async sleigh(){try{await ensure();const t=ctx.currentTime+.02;for(let i=0;i<22;i++)bells(t+i*.11+(i%2)*.03,.09);["G5","E5","C5"].forEach((n,i)=>tone("triangle",N(n),t+.2+i*.28,.24,.06));}catch(e){}},
    async chime(){try{await ensure();const t=ctx.currentTime+.02;["C6","E6","G6","C7"].forEach((n,i)=>tone("square",N(n),t+i*.09,.22,.07));bells(t,.1);}catch(e){}}
  };
})();
let curSong="";function np(name){curSong=name;const el=document.getElementById("np");el.title="Now playing: "+name;}
const bMusic=document.getElementById("bMusic"),bMusicL=document.getElementById("bMusicL");let userStopped=false;
const npBtn=document.getElementById("np");
function setMusicBtn(on){tgl(bMusic,on);bMusicL.textContent=on?"Stop carols":"Play carols";tgl(npBtn,on);npBtn.textContent=on?"♪ Music on":"♪ Music off";npBtn.title=on?"Now playing: "+(curSong||"Jingle Bells"):"Play carols";}
async function startMusic(){if(Music.on)return;try{await Music.start();setMusicBtn(true);}catch(e){bMusicL.textContent="No sound";bMusic.disabled=true;}}
const toggleMusic=async()=>{if(Music.on){Music.stop();setMusicBtn(false);userStopped=true;}else{userStopped=false;await startMusic();}};
bMusic.onclick=toggleMusic;npBtn.onclick=toggleMusic;
document.addEventListener("visibilitychange",()=>{if(document.hidden&&Music.on){Music.stop();setMusicBtn(false);}});


/* ---- Santa's sleigh flight ---- */
const sleighEl=document.getElementById("sleigh"),boardEl=document.getElementById("board");let flying=false;
function flySanta(){
  if(flying)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){sleighEl.animate([{transform:"translateY(0)"},{transform:"translateY(-10px)"},{transform:"translateY(0)"}],{duration:600});return;}
  flying=true;sleighEl.classList.add("flying");Music.sleigh();
  const W=boardEl.clientWidth,H=boardEl.clientHeight,w=sleighEl.offsetWidth;
  const dip=Math.min(H*.45,320);
  const out=sleighEl.animate([
    {transform:"translate(0,0) rotate(0)"},
    {transform:`translate(${-W*.25}px,${dip*.55}px) rotate(-8deg)`,offset:.25},
    {transform:`translate(${-W*.55}px,${dip}px) rotate(4deg)`,offset:.55},
    {transform:`translate(${-W*.85}px,${dip*.35}px) rotate(-10deg)`,offset:.8},
    {transform:`translate(${-W-w-40}px,${-dip*.2}px) rotate(-14deg)`}
  ],{duration:3600,easing:"ease-in-out",fill:"forwards"});
  const trail=setInterval(()=>{
    const r=sleighEl.getBoundingClientRect(),b=boardEl.getBoundingClientRect();
    for(let i=0;i<2;i++){const s=document.createElement("div");s.className="spark"+(Math.random()<.45?" s":"");
      s.style.left=(r.right-b.left-20+Math.random()*16)+"px";s.style.top=(r.top-b.top+r.height*.75+Math.random()*16)+"px";
      boardEl.appendChild(s);setTimeout(()=>s.remove(),1300);}
  },70);
  out.onfinish=()=>{clearInterval(trail);
    const back=sleighEl.animate([{transform:`translate(${w+60}px,-40px) rotate(-6deg)`},{transform:"translate(0,0) rotate(0)"}],{duration:1400,easing:"cubic-bezier(.2,1.3,.4,1)"});
    out.cancel();
    back.onfinish=()=>{flying=false;sleighEl.classList.remove("flying");};
  };
}
sleighEl.onclick=()=>{if(!userStopped)startMusic();flySanta();};
render();
map.fitBounds(L.latLngBounds(EVENTS.map(e=>[e.lat,e.lng])).pad(0.08));
setSnow(snowOn);
</script>
